services:
  azure-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      MCP_HTTP_PORT: "8080"
      MCP_HTTP_HOST: "0.0.0.0"
    # No credentials here: X-Azure-Tenant-Id / X-Azure-Client-Id /
    # X-Azure-Client-Secret are sent per request by the gateway, never read
    # from the environment.
